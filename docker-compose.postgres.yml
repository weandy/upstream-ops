services:
  postgres:
    image: postgres:16-alpine
    container_name: upstreamops-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-upstreamops}
      POSTGRES_USER: ${POSTGRES_USER:-upstreamops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upstreamops} -d ${POSTGRES_DB:-upstreamops}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-upstreamops}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DATABASE_NAME: ${POSTGRES_DB:-upstreamops}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      DATABASE_TIMEZONE: ${DATABASE_TIMEZONE:-Asia/Shanghai}

volumes:
  postgres-data:
